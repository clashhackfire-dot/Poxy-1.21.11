plugins {
    // Minecraft 1.21.11 is still obfuscated, so use the remapping Loom plugin.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
    flatDir { dirs 'natives' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "poxy" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:voxy:${project.voxy}"

    include(implementation(name: 'lwjgl-zstd-3.3.6-snapshot-natives-linux-android'))
    include(implementation(name: 'lwjgl-lmdb-3.3.6-snapshot-natives-linux-android'))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") { rename { "${it}_$project.name" } }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
}
