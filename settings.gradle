pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // Fabric Loom adds its own repository for generated Minecraft mappings.
    // Allow project/Loom repositories so officialMojangMappings() can resolve.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        maven { url = 'https://api.modrinth.com/maven' }
    }
}

rootProject.name = 'Poxy-1.21.11'
